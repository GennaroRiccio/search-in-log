[package]
name = "search-in-log"
version = "0.4.0"
edition = "2021"

[dependencies]
regex = "1.11.1"
console = "0.15.11"
clearscreen = "4.0.1"
kdam = { version = "0.6.2", features = ["template", "spinner"] }
fstream = "0.1.2"
bat = "0.25.0"
dialoguer = { version =  "0.11.0", features = ["fuzzy-select"] }
encoding = "0.2.33"
langchain-rust = { version = "4.6.0", features = ["ollama", "sqlite"] }
tokio = { version = "1.44.0", features = ["full"] }
